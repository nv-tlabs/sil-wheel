datastores:
    annotations_db: "/path/to/wheel-data/annotations_latest_schema.db"
    captions_db: "/path/to/wheel-data/captions_schema_latest.db"
    users_db: "/path/to/wheel-data/users.db"
    arena_db: "/path/to/wheel-data/arena.db"

    trajectory_store:
        trajectory_dir: "/path/to/wheel-data/trajectory_data/"

    cosmos_embed_store:
        embeddings_dir: "/path/to/wheel-data/"
        index_spec: "IVF4096,PQ96x8"

    visual_embed_store:
        embeddings_dir: "/path/to/wheel-data/visual_embeddings/"
        index_spec: "IVF4096,PQ64x8"
        mmap: true

    caption_embed_store:
        embeddings_dir: "/path/to/wheel-data/caption_embeddings/"
        index_spec: "IVF4096,PQ256x8"
        mmap: true

    wm_store:
        data_file: "/path/to/wheel-data/wm_stats_data.parquet"

    predictions_store:
        predictions_dir: "/path/to/wheel-data/predictions_latest/"

    classifier_search:
        classifier_dir: "/path/to/classifiers/"

    cluster_search:
        clustering_dir: "/path/to/wheel-data/clustering/"

    clip_list_search:
        clip_lists_dir: "/path/to/wheel-data/clip_lists/"

    bev_store:
        s3_bucket: "<your-s3-bucket>"
        metrics_index_dir: "/path/to/wheel-data/index_files"

clips_to_sil_apis: "/path/to/wheel-data/clips_to_apis_latest.json"

server:
    bindto: "0.0.0.0:8080"
    debug: false
    vlm_judge_workers: 20
    bug_report:
        spreadsheet_id: "<your-google-sheet-id>"
        credential_path: "/path/to/service-account.json"
    llm_provider: "auto"
    vlm_provider: "auto"